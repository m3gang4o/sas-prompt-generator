<!DOCTYPE html>
<html>
<head>
    <title>Generate Extension Icons</title>
</head>
<body>
    <h2>Icon Generator</h2>
    <p>Open this file in a browser and it will generate the extension icons automatically.</p>
    <canvas id="canvas16" width="16" height="16"></canvas>
    <canvas id="canvas48" width="48" height="48"></canvas>
    <canvas id="canvas128" width="128" height="128"></canvas>
    
    <script>
        function createIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background - SAS Blue
            ctx.fillStyle = '#0766D1';
            ctx.fillRect(0, 0, size, size);
            
            // White rounded square
            const padding = size * 0.2;
            const innerSize = size - (padding * 2);
            const radius = size * 0.15;
            
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.roundRect(padding, padding, innerSize, innerSize, radius);
            ctx.fill();
            
            // Draw "SAS" text or icon
            ctx.fillStyle = '#0766D1';
            ctx.font = `bold ${size * 0.3}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('SAS', size / 2, size / 2);
            
            // Download link
            canvas.toBlob((blob) => {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `icon${size}.png`;
                a.textContent = `Download icon${size}.png`;
                a.style.display = 'block';
                a.style.margin = '10px';
                document.body.appendChild(a);
            });
        }
        
        createIcon('canvas16', 16);
        createIcon('canvas48', 48);
        createIcon('canvas128', 128);
    </script>
</body>
</html>
